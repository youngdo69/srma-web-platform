project_seed:
  topic: >
    Effects of SGLT2 inhibitors in patients undergoing cardiac surgery

  review_type: "intervention_effect"

  objective: >
    To evaluate the efficacy and safety of preoperative or perioperative
    SGLT2 inhibitor exposure in adult patients undergoing cardiac surgery.

  hints:
    population:
      - "adult patients undergoing cardiac surgery"
      - "patients undergoing coronary artery bypass grafting"
      - "patients undergoing cardiac valve surgery"
      - "patients undergoing aortic surgery"

    intervention_or_exposure:
      - "SGLT2 inhibitors"
      - "preoperative SGLT2 inhibitor use"
      - "perioperative SGLT2 inhibitor exposure"

    comparator:
      - "no SGLT2 inhibitor use"
      - "placebo"
      - "standard care"

    outcomes:
      - "postoperative acute kidney injury"
      - "in-hospital mortality"
      - "postoperative heart failure"
      - "major adverse cardiovascular events"
      - "euglycemic diabetic ketoacidosis"
      - "length of hospital stay"

    study_designs:
      - "randomized controlled trials"
      - "prospective comparative cohort studies"
      - "retrospective comparative cohort studies"

  constraints:
    humans_only: true
    language_restriction: null
    date_restriction: null

  notes: >
    The initialization agent should identify whether transcatheter cardiac
    procedures, heart transplantation, ventricular assist device implantation,
    conference abstracts, non-comparative studies, and case series require
    separate human eligibility decisions.



