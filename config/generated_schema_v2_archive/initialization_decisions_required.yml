human_decisions_required:
- decision_id: D1-transcatheter
  question: Should transcatheter cardiac procedures (e.g., TAVR/TAVI, MitraClip) be
    included as eligible procedures?
  why_it_matters: These procedures are not open surgeries and may have different perioperative
    courses and risks, affecting applicability and heterogeneity.
  suggested_options:
  - Include
  - Exclude
- decision_id: D2-transplant
  question: Should heart transplantation be included as an eligible cardiac surgery?
  why_it_matters: Transplant recipients have distinct perioperative and immunologic
    profiles that may alter SGLT2i risk-benefit and increase heterogeneity.
  suggested_options:
  - Include
  - Exclude
- decision_id: D3-vad
  question: Should ventricular assist device (VAD) implantation be included as an
    eligible procedure?
  why_it_matters: VAD implantation patients differ markedly in indications, physiology,
    and perioperative management, potentially altering SGLT2i effects.
  suggested_options:
  - Include
  - Exclude
- decision_id: D4-abstracts
  question: Should conference abstracts without a corresponding peer-reviewed full
    text be eligible?
  why_it_matters: Abstract-only reports often lack methodological detail and complete
    outcomes; inclusion can bias results and limit risk-of-bias assessment.
  suggested_options:
  - Include
  - Exclude
- decision_id: D5-noncomparative
  question: Should non-comparative observational studies (e.g., single-arm series)
    be eligible?
  why_it_matters: The review targets comparative effectiveness/safety; including non-comparative
    designs may bias effect estimates and hinder pooling.
  suggested_options:
  - Include
  - Exclude
- decision_id: D6-case_series_reports
  question: Should case series or case reports be eligible?
  why_it_matters: Case reports/series provide very low-level evidence and can bias
    safety signals without appropriate denominators or comparators.
  suggested_options:
  - Include
  - Exclude
- decision_id: D7-case_control
  question: Should comparative case-control studies be eligible alongside cohorts
    and RCTs?
  why_it_matters: Case-control designs differ in risk-of-bias (selection/recall) and
    effect measures, potentially complicating synthesis.
  suggested_options:
  - Include
  - Exclude
