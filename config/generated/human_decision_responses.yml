human_decision_responses:
- decision_id: D1_TRANSCATHETER_INCLUDED
  question: Should transcatheter cardiac procedures (e.g., TAVR/TAVI, TMVR, MitraClip,
    other percutaneous structural heart procedures) be considered eligible as “cardiac
    surgery”?
  recommended_option: Exclude
  recommendation_rationale: Transcatheter procedures are not open surgical operations
    and typically have different perioperative risks and care pathways; excluding
    them preserves a homogeneous surgical population.
  suggested_options:
  - Include
  - Exclude
  selected_option: Exclude
  approval_status: pending
  reviewer_note: ''
- decision_id: D2_HEART_TRANSPLANT_INCLUDED
  question: Should heart transplantation be included as an eligible cardiac surgery?
  recommended_option: Exclude
  recommendation_rationale: Heart transplantation substantially differs from routine
    cardiac surgery with distinct risks and pathways; excluding improves clinical
    homogeneity.
  suggested_options:
  - Include
  - Exclude
  selected_option: Exclude
  approval_status: pending
  reviewer_note: ''
- decision_id: D3_VAD_INCLUDED
  question: Should ventricular assist device (VAD) implantation (e.g., LVAD/RVAD/BiVAD)
    be included as an eligible cardiac surgery?
  recommended_option: Exclude
  recommendation_rationale: VAD implantation represents a specialized population with
    different risk profiles; excluding maintains focus on routine cardiac surgeries
    (CABG/valve/aortic).
  suggested_options:
  - Include
  - Exclude
  selected_option: Exclude
  approval_status: pending
  reviewer_note: ''
- decision_id: D4_CONFERENCE_ABSTRACTS
  question: Should conference abstracts without full-text articles be eligible?
  recommended_option: Exclude
  recommendation_rationale: Abstract-only records often lack sufficient methodological
    and outcome details for reliable synthesis; excluding prioritizes data quality.
  suggested_options:
  - Include
  - Exclude
  selected_option: Exclude
  approval_status: pending
  reviewer_note: ''
- decision_id: D5_NON_COMPARATIVE_STUDIES
  question: Should non-comparative study designs (e.g., single-arm cohorts, before–after
    without concurrent control) be eligible?
  recommended_option: Exclude
  recommendation_rationale: The review targets intervention effects; restricting to
    RCTs and comparative cohorts maintains internal validity and analytic consistency.
  suggested_options:
  - Include
  - Exclude
  selected_option: Exclude
  approval_status: pending
  reviewer_note: ''
- decision_id: D6_CASE_SERIES
  question: Should case series or case reports be eligible?
  recommended_option: Exclude
  recommendation_rationale: To maintain focus on comparative effects with stronger
    internal validity, exclude case series/reports.
  suggested_options:
  - Include
  - Exclude
  selected_option: Exclude
  approval_status: pending
  reviewer_note: ''
