toolkit:
  name: Universal Systematic Review Toolkit
  version: 1.0.0
project:
  id: proj_sglt2_cardiac_surgery_001
  slug: sglt2-cardiac-surgery
  title: Effects of SGLT2 inhibitors in patients undergoing cardiac surgery
  short_name: SGLT2i in cardiac surgery
review:
  type: intervention_effect
  objective: To evaluate the efficacy and safety of preoperative or perioperative
    SGLT2 inhibitor exposure in adult patients undergoing cardiac surgery.
  question: Among adults undergoing cardiac surgery, does preoperative or perioperative
    exposure to SGLT2 inhibitors, compared with no SGLT2 inhibitor (placebo or standard
    care), affect clinical efficacy and safety outcomes?
  framework:
    name: PICO
    elements:
    - label: Population
      values:
      - Adults (≥18 years) undergoing cardiac surgery
      - Coronary artery bypass grafting (CABG)
      - Cardiac valve surgery (repair or replacement)
      - Open aortic surgery (e.g., ascending aorta, aortic root/arch)
      - Combined cardiac surgical procedures
    - label: Intervention
      values:
      - Preoperative SGLT2 inhibitor use
      - Perioperative SGLT2 inhibitor exposure
      - 'Individual agents: empagliflozin, dapagliflozin, canagliflozin, ertugliflozin,
        sotagliflozin'
    - label: Comparator
      values:
      - No SGLT2 inhibitor use
      - Placebo
      - Standard care/usual care
    - label: Outcomes
      values:
      - Postoperative acute kidney injury (AKI)
      - In-hospital mortality
      - Postoperative heart failure or decompensation
      - Major adverse cardiovascular events (MACE)
      - Euglycemic diabetic ketoacidosis (euDKA)
      - Length of hospital stay
eligibility:
  inclusion:
  - Human adults (≥18 years)
  - Undergoing cardiac surgery (open surgical procedures including CABG, valve surgery,
    open aortic surgery, or combined procedures)
  - 'Exposure: preoperative or perioperative SGLT2 inhibitor use (any agent in class)'
  - 'Comparative study design: randomized controlled trials or comparative cohort
    studies (prospective or retrospective)'
  - 'Comparator: placebo, standard care/usual care, or no SGLT2 inhibitor'
  - No language or date restrictions
  exclusion:
  - Non-human studies
  - Pediatric populations (<18 years)
  - Non-cardiac surgery
  - Wrong intervention (not SGLT2 inhibitor or timing unrelated to pre/perioperative
    period)
  - No comparator group
  - Non-original research (e.g., editorials, narrative reviews)
  - Duplicate or superseded reports
screening:
  decisions:
  - Include
  - Exclude
  - Unclear
  decision_rules:
    include:
    - Adults undergoing open cardiac surgical procedures with preoperative or perioperative
      SGLT2 inhibitor exposure
    - 'Comparative designs: randomized controlled trials or comparative cohort studies
      with an appropriate control (placebo/standard care/no SGLT2 inhibitor)'
    - Reports presenting extractable outcome data relevant to efficacy or safety
    exclude:
    - Non-human or pediatric studies
    - Non-cardiac surgery populations
    - Wrong intervention (not an SGLT2 inhibitor or wrong timing)
    - No comparator group
    - Non-original research (reviews, editorials), or duplicates
    unclear:
    - Insufficient detail on surgical approach or timing of exposure
    - Ambiguous study design or comparator; seek full text or author clarification
  exclusion_reasons:
  - code: NON_HUMAN
    label: Non-human study
    description: Study conducted in animals, in vitro, or otherwise not involving
      human participants.
  - code: PEDIATRIC
    label: Pediatric population
    description: Majority of participants are younger than 18 years or pediatric cardiac
      surgery.
  - code: WRONG_POPULATION_NONCARDIAC_SURGERY
    label: 'Wrong population: non-cardiac surgery'
    description: Participants did not undergo cardiac surgery.
  - code: WRONG_INTERVENTION_NOT_SGLT2I
    label: 'Wrong intervention: not SGLT2 inhibitor'
    description: Intervention is not an SGLT2 inhibitor or exposure not in pre/perioperative
      window.
  - code: NO_COMPARATOR
    label: No comparator group
    description: Study lacks a comparator arm (placebo/standard care/no SGLT2 inhibitor).
  - code: NOT_ORIGINAL_RESEARCH
    label: Not original research
    description: Publication is a review, editorial, commentary, letter without primary
      comparative data.
  - code: DUPLICATE
    label: Duplicate or superseded
    description: Duplicate publication or interim analysis superseded by a more complete
      report.
paths:
  raw_data: data/raw/
  processed_data: data/processed/
  screening_results: outputs/screening/
  logs: logs/
  search_strategies: search/strategies/
