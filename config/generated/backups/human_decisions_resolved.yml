resolved_human_decisions:
- decision_id: HD1_transcatheter_procedures
  question: Should studies of transcatheter cardiac procedures (e.g., TAVR/TAVI, TMVR,
    MitraClip) be eligible?
  recommended_option: Exclude transcatheter cardiac procedures.
  selected_option: Exclude transcatheter cardiac procedures.
  status: approved
  approved_at: 2026-08-03 20:09:09
  approval_source: approve_all_recommended
- decision_id: HD2_heart_transplantation
