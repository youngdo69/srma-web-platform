project:
  id: sglt2_inhibitors_cardiac_surgery
  title: 'Efficacy and safety of preoperative or perioperative SGLT2 inhibitors in
    adult cardiac surgery: a systematic review and meta-analysis'
  short_name: sglt2i_card_surg
search:
  concepts:
  - concept_id: population
    label: Adult patients undergoing open cardiac surgery
    role: population
    required: yes
    free_text_terms:
    - cardiac surgery
    - heart surgery
    - open-heart surgery
    - coronary artery bypass
    - coronary artery bypass grafting
    - coronary bypass
    - CABG
    - valve surgery
    - valve replacement
    - valvular surgery
    - aortic surgery
    - aortic root replacement
    - aortic arch surgery
    abbreviations:
    - CABG
    spelling_variants:
    - open heart surgery
    - valvular operation
    - coronary by-pass
    controlled_vocabulary:
      pubmed_mesh_candidates:
      - Cardiac Surgical Procedures
      - Coronary Artery Bypass
      - Heart Valve Prosthesis Implantation
      - Aortic Aneurysm, Thoracic
      embase_emtree_candidates:
      - heart surgery
      - coronary artery bypass graft
      - heart valve replacement
      - aorta surgery
  - concept_id: intervention
    label: SGLT2 inhibitors (gliflozins), preoperative or perioperative exposure
    role: intervention
    required: yes
    free_text_terms:
    - sodium-glucose cotransporter 2 inhibitor
    - sodium-glucose co-transporter 2 inhibitor
    - sglt2 inhibitor
    - gliflozin
    - dapagliflozin
    - empagliflozin
    - canagliflozin
    - ertugliflozin
    - ipragliflozin
    abbreviations:
    - SGLT2
    - SGLT2i
    spelling_variants:
    - sodium glucose cotransporter 2 inhibitor
    - sodium glucose co-transporter 2 inhibitor
    - co transporter 2
    controlled_vocabulary:
      pubmed_mesh_candidates:
      - Sodium-Glucose Transporter 2 Inhibitors
      - Dapagliflozin
      - Empagliflozin
      - Canagliflozin
      - Ertugliflozin
      embase_emtree_candidates:
      - sodium glucose cotransporter 2 inhibitor
      - dapagliflozin
      - empagliflozin
      - canagliflozin
      - ertugliflozin
  combination:
    operator_between_concepts: AND
    notes: Population specifies open cardiac surgical procedures to anchor the perioperative
      window. Outcomes are intentionally omitted from search concepts to maintain
      recall; they will be applied during screening.
  outcome_terms_policy: Do not include outcomes as mandatory search concepts; screen
    for outcomes during study selection to preserve sensitivity.
validation:
  known_relevant_ids: []
  controlled_vocabulary_requires_verification: yes
