human_decisions_required:
- decision_id: D1_TRANSCATHETER_INCLUDED
  question: Should transcatheter cardiac procedures (e.g., TAVR/TAVI, TMVR, MitraClip,
    other percutaneous structural heart procedures) be considered eligible as “cardiac
    surgery”?
  why_it_matters: Including transcatheter procedures could introduce heterogeneous,
    non-surgical perioperative pathways and confound safety/efficacy estimates specific
    to open cardiac surgery.
  suggested_options:
  - Include
  - Exclude
  recommended_option: Exclude
  recommendation_rationale: Transcatheter procedures are not open surgical operations
    and typically have different perioperative risks and care pathways; excluding
    them preserves a homogeneous surgical population.
  affected_components:
  - project_config.eligibility
  - project_config.screening.decision_rules
  - project_config.screening.exclusion_reasons
  option_patches:
  - option: Include
    operations:
    - target: project_config
      path:
      - eligibility
      - inclusion
      operation: append_unique
      value_json: '"Transcatheter cardiac procedures (e.g., TAVR/TAVI, TMVR, MitraClip)
        are eligible."'
      match_key: ''
      match_value_json: ''
      rationale: Explicitly allow transcatheter procedures as part of the eligible
        population.
    - target: project_config
      path:
      - screening
      - decision_rules
      - include
      operation: append_unique
      value_json: '"Transcatheter cardiac procedures are eligible as cardiac surgery."'
      match_key: ''
      match_value_json: ''
      rationale: Create an operational screening rule to include these procedures.
    - target: project_config
      path:
      - screening
      - decision_rules
      - exclude
      operation: remove_value
      value_json: '"Transcatheter cardiac procedures (e.g., TAVR/TAVI, TMVR) are not
        eligible (not open cardiac surgery)."'
      match_key: ''
      match_value_json: ''
      rationale: Remove any prior rule excluding transcatheter procedures if present.
    - target: project_config
      path:
      - screening
      - exclusion_reasons
      operation: remove_record_by_key
      value_json: ''
      match_key: code
      match_value_json: '"NOT_CARDIAC_SURGERY_TRANSCATHETER"'
      rationale: Ensure no exclusion reason remains that would contradict inclusion
        of transcatheter procedures.
  - option: Exclude
    operations:
    - target: project_config
      path:
      - eligibility
      - exclusion
      operation: append_unique
      value_json: '"Transcatheter cardiac procedures (e.g., TAVR/TAVI, TMVR, MitraClip)"'
      match_key: ''
      match_value_json: ''
      rationale: Record explicit exclusion of transcatheter procedures.
    - target: project_config
      path:
      - screening
      - decision_rules
      - exclude
      operation: append_unique
      value_json: '"Transcatheter cardiac procedures (e.g., TAVR/TAVI, TMVR) are not
        eligible (not open cardiac surgery)."'
      match_key: ''
      match_value_json: ''
      rationale: Operationalize exclusion during screening.
    - target: project_config
      path:
      - screening
      - exclusion_reasons
      operation: append_record
      value_json: '{"code":"NOT_CARDIAC_SURGERY_TRANSCATHETER","label":"Not cardiac
        surgery: transcatheter procedure","description":"Study limited to transcatheter/percutaneous
        cardiac interventions (e.g., TAVR/TAVI, TMVR, MitraClip) without open surgery."}'
      match_key: ''
      match_value_json: ''
      rationale: Provide a standardized exclusion code for transcatheter-only studies.
- decision_id: D2_HEART_TRANSPLANT_INCLUDED
  question: Should heart transplantation be included as an eligible cardiac surgery?
  why_it_matters: Heart transplant recipients have unique perioperative and immunologic
    profiles that could alter safety/efficacy of SGLT2 inhibitors, potentially biasing
    pooled estimates for standard cardiac surgeries.
  suggested_options:
  - Include
  - Exclude
  recommended_option: Exclude
  recommendation_rationale: Heart transplantation substantially differs from routine
    cardiac surgery with distinct risks and pathways; excluding improves clinical
    homogeneity.
  affected_components:
  - project_config.eligibility
  - project_config.screening.decision_rules
  - project_config.screening.exclusion_reasons
  option_patches:
  - option: Include
    operations:
    - target: project_config
      path:
      - eligibility
      - inclusion
      operation: append_unique
      value_json: '"Heart transplantation is eligible."'
      match_key: ''
      match_value_json: ''
      rationale: Explicitly include heart transplantation in the eligible population.
    - target: project_config
      path:
      - screening
      - decision_rules
      - include
      operation: append_unique
      value_json: '"Include heart transplantation as an eligible cardiac surgery."'
      match_key: ''
      match_value_json: ''
      rationale: Operationalize inclusion during screening.
    - target: project_config
      path:
      - screening
      - exclusion_reasons
      operation: remove_record_by_key
      value_json: ''
      match_key: code
      match_value_json: '"HEART_TRANSPLANT"'
      rationale: Remove any conflicting exclusion reason.
    - target: project_config
      path:
      - screening
      - decision_rules
      - exclude
      operation: remove_value
      value_json: '"Heart transplantation is not eligible."'
      match_key: ''
      match_value_json: ''
      rationale: Remove conflicting exclusion rule if present.
  - option: Exclude
    operations:
