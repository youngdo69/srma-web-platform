      operation: append_unique
      value_json: '"Heart transplantation"'
      match_key: ''
      match_value_json: ''
      rationale: Record explicit exclusion of heart transplantation.
    - target: project_config
      path:
      - screening
      - decision_rules
      - exclude
      operation: append_unique
      value_json: '"Heart transplantation is not eligible."'
      match_key: ''
      match_value_json: ''
      rationale: Operationalize exclusion during screening.
    - target: project_config
      path:
      - screening
      - exclusion_reasons
      operation: append_record
      value_json: '{"code":"HEART_TRANSPLANT","label":"Heart transplantation","description":"Study
