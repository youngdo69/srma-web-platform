agent_screening:
  enabled: true

  reviewer:
    role: "Reviewer 1"
    name: "Agent Reviewer 1"
    type: "LLM"

  provider:
    name: "openai"
    api_key_env: "OPENAI_API_KEY"
    base_url: "https://api.openai.com/v1"
    model: "gpt-6-luna"
    reasoning_effort: "low"

  prompt:
    template_file: "prompts/title_abstract_screening_prompt.md"
    version: "1.0.0"

  processing:
    start_record: 1
    max_records: null
    checkpoint_every: 5
    resume_from_checkpoint: true
    overwrite_existing_agent_decisions: false
    request_pause_seconds: 0.2
    max_retries: 3
    timeout_seconds: 120

    # Universal bounded parallel scheduling for title/abstract screening.
    # Each record remains an independent LLM request with its own response ID,
    # validation, retry history, and checkpoint entry.
    parallel_enabled: true
    parallel_workers: 4
    parallel_max_workers: 6

  # OpenAI official GPT-6 Luna Standard pricing, USD per 1M text tokens.
  # This metadata is advisory; missing/mismatched pricing never blocks screening.
  # Batch/Flex cost is 50% of Standard and uses a separate service tier.
  cost_optimization:
    rate_card:
      model: "gpt-6-luna"
      service_tier: "standard"
      input_usd_per_million: 0.10
      cached_input_usd_per_million: 0.01
      cache_write_usd_per_million: 0.125
      output_usd_per_million: 0.50
      source: "https://developers.openai.com/api/docs/models/gpt-6-luna"

  decision_policy:
    unclear_when_insufficient_information: true
    require_exclusion_reason_for_exclude: true
    prohibit_exclusion_reason_for_include_or_unclear: true
    require_rationale: true
    allowed_confidence:
      - "High"
      - "Moderate"
      - "Low"

  output:
    workbook_basename: "title_abstract_screening_agent"
    decisions_basename: "agent_screening_decisions"
    failures_basename: "agent_screening_failures"
    checkpoint_basename: "agent_screening_checkpoint"
    report_basename: "agent_screening_report"
