# ============================================================
# Cardiac Surgery SR-MA Toolkit v2.0
# Primary project configuration
#
# This file is the authoritative source for project-specific
# settings used by the SR-MA workflow.
#
# Search concepts and database-specific search terms remain in:
# config/search_terms.yml
# ============================================================

schema_version: "1.0"

project:
  project_id: "sglt2i_cardiac_surgery"
  title: "Effects of SGLT2 Inhibitors in Patients Undergoing Cardiac Surgery"
  short_name: "SGLT2i_Cardiac_Surgery_SRMA"
  output_prefix: "sglt2i_cardiac_surgery"
  version: "1.0"
  status: "search_and_screening"

  principal_investigator: "Jason"
  clinical_field: "Cardiac Surgery"

  protocol_registration:
    registry: "PROSPERO"
    registration_number: ""
    registration_date: ""

research_question:
  framework: "PICO"

  population:
    description: "Adults undergoing cardiac surgery"
    minimum_age: 18

  intervention:
    description: "Treatment with an SGLT2 inhibitor"
    drugs:
      - "dapagliflozin"
      - "empagliflozin"
      - "canagliflozin"
      - "ertugliflozin"

  comparator:
    description: "No SGLT2 inhibitor, placebo, or standard care"

  outcomes:
    primary:
      - "postoperative acute kidney injury"
      - "operative or short-term mortality"

    secondary:
      - "major adverse cardiovascular events"
      - "heart failure"
      - "postoperative atrial fibrillation"
      - "renal replacement therapy"
      - "length of intensive care unit stay"
      - "length of hospital stay"
      - "perioperative ketoacidosis"
      - "hypoglycemia"

eligibility:
  study_designs:
    include:
      - "randomized controlled trial"
      - "prospective cohort study"
      - "retrospective cohort study"

    exclude:
      - "case report"
      - "case series"
      - "review"
      - "editorial"
      - "conference abstract without sufficient outcome data"

  language_restriction: "none"

  publication_status:
    include_peer_reviewed_articles: true
    include_preprints: false
    include_conference_abstracts: false

  minimum_sample_size: 10

search:
  terms_file: "config/search_terms.yml"

  databases:
    pubmed:
      enabled: true
      display_name: "PubMed/MEDLINE"

    embase:
      enabled: true
      display_name: "Embase"

    central:
      enabled: true
      display_name: "Cochrane CENTRAL"

  additional_sources:
    - "reference lists"
    - "ClinicalTrials.gov"

  search_start_date: "inception"
  search_end_date: ""

screening:
  number_of_reviewers: 2
  independent_screening: true
  disagreement_resolution: "discussion or third reviewer"

  decisions:
    - "Include"
    - "Exclude"
    - "Unclear"

  exclusion_reasons:
    - code: "E01"
      label: "Not cardiac surgery"

    - code: "E02"
      label: "No SGLT2 inhibitor exposure"

    - code: "E03"
      label: "Wrong population"

    - code: "E04"
      label: "Wrong comparator"

    - code: "E05"
      label: "Wrong study design"

    - code: "E06"
      label: "No relevant clinical outcome"

    - code: "E07"
      label: "Animal or laboratory study"

    - code: "E08"
      label: "Protocol, editorial, commentary, or review"

    - code: "E09"
      label: "Duplicate or secondary publication"

    - code: "E10"
      label: "Conference abstract with insufficient information"

    - code: "E11"
      label: "Other"

  reviewers:
    reviewer_1:
      name: ""
      initials: ""

    reviewer_2:
      name: ""
      initials: ""

    third_reviewer:
      name: ""
      initials: ""

data_extraction:
  reviewers: 2
  independent_extraction: true
  disagreement_resolution: "consensus"

risk_of_bias:
  randomized_trials: "RoB 2"
  nonrandomized_studies: "ROBINS-I"

analysis:
  software: "R"

  binary_effect_measure: "RR"
  continuous_effect_measure: "MD"
  time_to_event_effect_measure: "HR"

  model:
    primary: "random-effects"
    common_effect_sensitivity: true

  heterogeneity:
    tau_squared_estimator: "REML"
    hartung_knapp_adjustment: true
    prediction_interval: true

  statistical_significance:
    alpha: 0.05
    confidence_interval: 0.95

  zero_event_handling:
    continuity_correction: 0.5
    double_zero_studies_primary_analysis: false

  subgroup_analyses:
    - "type of cardiac surgery"
    - "specific SGLT2 inhibitor"
    - "diabetes status"
    - "heart failure status"
    - "timing of drug discontinuation"
    - "randomized versus observational study"

  sensitivity_analyses:
    - "leave-one-out analysis"
    - "low-risk-of-bias studies only"
    - "randomized studies only"
    - "alternative effect measures"
    - "alternative tau-squared estimator"

  meta_regression:
    minimum_number_of_studies: 10

    candidate_moderators:
      - "mean age"
      - "proportion of patients with diabetes"
      - "proportion of CABG"
      - "proportion of valve surgery"
      - "study year"

  publication_bias:
    minimum_number_of_studies: 10

    methods:
      - "funnel plot"
      - "Egger regression test"
      - "rank correlation test"

certainty_of_evidence:
  framework: "GRADE"

reporting:
  guideline: "PRISMA 2020"
  target_journal: "International Journal of Surgery"

naming:
  pubmed_basename: "pubmed_sglt2i_cardiac_surgery"
  embase_basename: "embase_sglt2i_cardiac_surgery"
  central_basename: "central_sglt2i_cardiac_surgery"

  merged_records_basename: "all_database_records_before_deduplication"
  deduplicated_records_basename: "deduplicated_records_for_screening"
  removed_duplicates_basename: "removed_duplicate_records"
  deduplication_map_basename: "deduplication_map"
  prisma_counts_basename: "search_and_deduplication_counts"

  screening_workbook_basename: "title_abstract_screening_workbook"
  completed_screening_workbook_basename: "title_abstract_screening_completed"

paths:
  search_terms_file: "config/search_terms.yml"

  search_strategies_directory: "search_strategies"

  raw_search_directory: "data/raw/search"
  pubmed_directory: "data/raw/search/pubmed"
  embase_directory: "data/raw/search/embase"
  central_directory: "data/raw/search/central"

  processed_search_directory: "data/processed/search"
  processed_screening_directory: "data/processed/screening"

  screening_results_directory: "results/screening"
  logs_directory: "results/logs"
  figures_directory: "results/figures"
  tables_directory: "results/tables"
  manuscript_directory: "results/manuscript"
  
